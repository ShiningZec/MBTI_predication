# ============================================================
# MBTI 模型训练配置文件
# ============================================================
# 用法：
#   python train.py                        # 使用此文件全部默认值
#   python train.py --cfg config/exp1.yaml # 指定其他配置文件
#   python train.py --epochs 10 --lr 5e-5 # CLI 参数会覆盖配置文件
# ============================================================

# ---- 模型 ----
model:
  name: "D:/ML/MBTI_pred/models/roberta-base"   # HuggingFace 模型名或本地路径
  pooling: "cls"                                # HP搜索最优: cls > mean
  max_length: 512                               # HP搜索固定
  freeze_backbone: false
  dropout: 0.2                                  # HP偏低，全量数据防过拟合

# ---- 分类器 ----
classifier:
  head_hidden: 512                              # HP搜索最优: 512 > 256 > 128 > 64

# ---- 训练 ----
training:
  num_epochs: 10                                # 最终训练
  batch_size: 32
  gradient_accumulation_steps: 1
  max_grad_norm: 1.0
  fp16: true
  num_workers: 8
  seed: 42
  early_stopping_patience: 3

# ---- 优化器 ----
optimizer:
  learning_rate: 0.0000284                      # Encoder (HP最优，保持)
  classifier_lr: 0.0001                         # 分类头 (HP偏高，回退到安全值)
  weight_decay: 0.01                            # HP偏低，全量数据防过拟合
  warmup_ratio: 0.027                           # HP搜索最优

# ---- 损失函数 ----
# 四个维度的损失权重 (建议和为 1.0)
# SN 极不均衡 (91% N), 适当提高权重
loss:
  dim_weights:
    EI: 0.25
    SN: 0.35
    TF: 0.20
    JP: 0.20
  # 正样本权重, 缓解类别不均衡 (None=不使用)
  pos_weights:
    EI: null
    SN: 10.0
    TF: null
    JP: null

# ---- 数据 ----
data:
  train_csv: "data/train.csv"
  test_csv: "data/test.csv"
  label_map: "data/label_map.json"

# ---- 输出 ----
output:
  dir: "output"                                 # 模型保存根目录
  save_best: true                               # 是否保存最佳模型
  log_interval: 50                              # 训练时每 N batch 打印一次
