<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MBTI AI 预测系统</title>
<style>
/* ============================================================
   M3 Dark Theme — Pure CSS, zero dependencies
   ============================================================ */
:root {
  --bg-root: #0d0f13;
  --bg-sidebar: #131314;
  --bg-surface: #1a1d23;
  --bg-surface-high: #1e2128;
  --bg-surface-highest: #242833;
  --bg-input: #15181e;
  --text: #e2e2e9;
  --text2: #c4c6d0;
  --text3: #8e9099;
  --outline: #44474f;
  --primary: #a9c7ff;
  --primary-dim: #7ba0e0;
  --primary-bg: #1a2d50;
  --error: #ffb4ab;
  --error-bg: #3d1218;
  --success: #34a853;
  --warn: #fbbc04;
  --radius-sm: 10px;
  --radius: 18px;
  --radius-lg: 22px;
  --radius-full: 999px;
  --shadow-1: 0 1px 4px rgba(0,0,0,.4);
  --shadow-2: 0 2px 8px rgba(0,0,0,.5);
  --ease: 250ms cubic-bezier(0.2,0,0,1);
  --sidebar-w: 260px;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{font-size:16px;-webkit-font-smoothing:antialiased;color-scheme:dark}
body{
  font-family:'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
  display:flex;height:100vh;overflow:hidden;
  background:var(--bg-root);color:var(--text);line-height:1.6;
}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--outline);border-radius:999px}
::selection{background:rgba(169,199,255,.3)}

/* ---- Sidebar ---- */
.sidebar{
  width:var(--sidebar-w);min-width:var(--sidebar-w);background:var(--bg-sidebar);
  display:flex;flex-direction:column;border-right:1px solid rgba(255,255,255,.06);
  z-index:10;
}
.sidebar-head{
  padding:22px 20px 14px;font-size:16px;font-weight:700;letter-spacing:-.01em;
  display:flex;align-items:center;gap:10px;
}
.sidebar-head .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.sidebar-head .dot.online{background:var(--success);box-shadow:0 0 8px rgba(52,168,83,.5)}
.sidebar-head .dot.offline{background:var(--error);box-shadow:0 0 8px rgba(234,67,53,.5)}
.sidebar-head .dot.checking{background:var(--warn);animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

.nav-list{flex:1;padding:6px 12px;display:flex;flex-direction:column;gap:2px}
.nav-item{
  display:flex;align-items:center;gap:12px;padding:10px 16px;border:none;
  background:transparent;color:var(--text2);font-size:14px;font-weight:500;
  border-radius:0 var(--radius-full) var(--radius-full) 0;cursor:pointer;
  transition:all var(--ease);text-align:left;width:100%;
}
.nav-item:hover{background:rgba(255,255,255,.04);color:var(--text)}
.nav-item.active{background:rgba(169,199,255,.1);color:var(--text);font-weight:600}
.nav-item .ico{font-size:18px;width:24px;text-align:center;flex-shrink:0}
.sidebar-foot{padding:16px 20px;font-size:11px;color:var(--text3);border-top:1px solid rgba(255,255,255,.05)}

/* ---- Main ---- */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative}
.view{height:100%;display:flex;flex-direction:column}
.view.hidden{display:none}

/* ==== Chat View ==== */
.chat-msgs{flex:1;overflow-y:auto;padding:32px 24px 16px;display:flex;flex-direction:column;gap:20px}
.chat-welcome{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px}
.chat-welcome h1{font-size:28px;font-weight:600;letter-spacing:-.02em;margin-bottom:8px}
.chat-welcome p{color:var(--text2);font-size:15px;max-width:480px}

.msg{display:flex;gap:10px;max-width:88%;animation:msgIn .3s ease-out}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg.user{align-self:flex-end;flex-direction:row-reverse}
.msg.ai{align-self:flex-start}
.msg-avatar{width:32px;height:32px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:16px}
.msg.user .msg-avatar{background:var(--primary-bg)}
.msg.ai .msg-avatar{background:var(--bg-surface-highest)}
.msg-bubble{padding:14px 18px;border-radius:var(--radius);font-size:14px;line-height:1.65}
.msg.user .msg-bubble{background:var(--primary-bg);color:var(--text);border-bottom-right-radius:6px}
.msg.ai .msg-bubble{background:var(--bg-surface-high);border-bottom-left-radius:6px}

/* Type card in chat */
.type-card-c{
  background:var(--bg-surface);border-radius:var(--radius-lg);
  padding:28px 18px;box-shadow:var(--shadow-2);text-align:center;
}
.type-card-c .letters{display:flex;justify-content:center;gap:12px;margin-bottom:4px}
.type-card-c .letters span{font-size:54px;font-weight:700;letter-spacing:-.02em;line-height:1}
.l-e{color:#7aa9ff}.l-i{color:#5b8cd4}.l-s{color:#4ecdc4}.l-n{color:#9b7ed8}
.l-t{color:#f29766}.l-f{color:#f0a080}.l-j{color:#b9a0e8}.l-p{color:#7ec8a0}
.type-card-c .sub{font-size:14px;color:var(--text2);margin-bottom:12px}

.dim-bars-c{margin-top:10px}
.dbar{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:12px}
.dbar .dlbl{font-weight:700;min-width:28px;color:var(--text2)}
.dbar .dpole{min-width:14px;text-align:center;color:var(--text3);font-size:11px}
.dbar .dpole.on{color:var(--text);font-weight:700}
.dbar .track{flex:1;height:6px;background:var(--bg-surface-highest);border-radius:999px;position:relative;overflow:hidden}
.dbar .fill{height:100%;border-radius:999px;position:absolute;top:0;transition:width .8s cubic-bezier(.2,0,0,1)}
.dbar .fill.fl{left:0}.fill.fr{right:0}
.dbar .fill.dei{background:linear-gradient(90deg,#5b8cd4,#7aa9ff)}
.dbar .fill.dsn{background:linear-gradient(90deg,#3db8b0,#9b7ed8)}
.dbar .fill.dtf{background:linear-gradient(90deg,#f0a080,#f29766)}
.dbar .fill.djp{background:linear-gradient(90deg,#b9a0e8,#7ec8a0)}
.dbar .dpct{font-weight:600;min-width:36px;text-align:right;font-size:12px}

.kw-box-c{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.kw-box-c .kw{font-size:12px;padding:4px 10px;background:var(--bg-surface-high);border-radius:8px;display:flex;align-items:center;gap:4px}
.kw-box-c .kw .sc{font-size:11px}.sc.pos{color:var(--success)}.sc.neg{color:var(--error)}

.interp-c{margin-top:10px;padding:12px 16px;border-left:2px solid var(--primary);background:var(--bg-surface-high);border-radius:0 var(--radius-sm) var(--radius-sm) 0;font-size:14px;line-height:1.7;color:var(--text2)}

/* Chat input bar */
.chat-bar{
  padding:12px 24px 16px;background:var(--bg-root);
  border-top:1px solid rgba(255,255,255,.06);display:flex;align-items:flex-end;gap:10px;
}
.chat-bar textarea{
  flex:1;resize:none;padding:12px 18px;min-height:52px;max-height:160px;
  background:var(--bg-input);border:1px solid var(--outline);border-radius:20px;
  color:var(--text);font-family:inherit;font-size:14px;line-height:1.5;outline:none;
  transition:border-color var(--ease),box-shadow var(--ease);
}
.chat-bar textarea:focus{border-color:var(--primary-dim);box-shadow:0 0 0 3px rgba(169,199,255,.15)}
.chat-bar textarea::placeholder{color:var(--text3)}
.send-btn{
  width:44px;height:44px;border-radius:50%;border:none;flex-shrink:0;
  background:var(--primary-bg);color:var(--primary);cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:all var(--ease);
}
.send-btn:hover{filter:brightness(1.2)}
.send-btn:disabled{opacity:.35;cursor:not-allowed;filter:none}
.send-btn .spinner{
  width:18px;height:18px;border:2px solid transparent;border-top-color:currentColor;
  border-radius:50%;animation:spin .8s linear infinite;display:none;
}
.send-btn.loading .ico-s{display:none}.send-btn.loading .spinner{display:block}
@keyframes spin{to{transform:rotate(360deg)}}

.chat-err{color:var(--error);font-size:13px;padding:8px 28px 0;display:none}
.chat-err.v{display:block}

/* ==== Model View ==== */
.model-view{padding:24px;overflow-y:auto;height:100%}
.mcard{
  background:var(--bg-surface);border-radius:var(--radius-lg);
  padding:26px;margin-bottom:18px;box-shadow:var(--shadow-1);
}
.mcard h3{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text2);margin-bottom:16px}

/* Chips */
.chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.chip{
  display:inline-flex;align-items:center;gap:5px;padding:6px 14px;
  background:var(--bg-surface-high);border-radius:var(--radius-full);
  font-size:12px;font-weight:500;color:var(--text2);
}

/* Metrics grid */
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.mcard-sm{
  background:var(--bg-surface-high);border-radius:var(--radius-lg);
  padding:22px 14px 18px;text-align:center;box-shadow:var(--shadow-1);
}
.mcard-sm .lbl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text2);margin-bottom:12px}
.mr{display:flex;justify-content:space-between;padding:3px 0;font-size:13px}
.mr .mk{color:var(--text2);font-size:11px}
.mr .mv{font-weight:600}

.moverall{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;padding:14px 20px;background:var(--bg-surface-high);border-radius:var(--radius);margin-bottom:20px;font-size:13px}
.moverall .mi{display:flex;align-items:center;gap:5px}
.moverall .mi .mk{color:var(--text2)}.moverall .mi .mv{font-weight:600}

/* Tabs */
.tab-bar{display:flex;gap:0;margin-bottom:16px;border-bottom:1px solid var(--outline)}
.tab-btn{
  padding:10px 18px;border:none;background:transparent;color:var(--text2);
  font-size:13px;font-weight:500;cursor:pointer;position:relative;transition:color var(--ease);
}
.tab-btn:hover{color:var(--text)}
.tab-btn.active{color:var(--primary)}
.tab-btn.active::after{
  content:'';position:absolute;bottom:-1px;left:0;right:0;height:2px;
  background:var(--primary);border-radius:2px 2px 0 0;transition:left var(--ease);
}

/* Charts grid — confusion & confidence span full width */
.charts-g{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;margin-top:12px}
.charts-g img{
  width:100%;border-radius:var(--radius);object-fit:contain;
  background:var(--bg-surface-highest);box-shadow:var(--shadow-1);display:none;
}
.charts-g img.show{display:block}
.charts-g img.full{grid-column:1/-1;max-height:520px}

/* Gauge */
.gauge-svg{width:60px;height:60px}
.gauge-bg{fill:none;stroke:var(--bg-surface-highest);stroke-width:5}
.gauge-fg{fill:none;stroke:var(--primary);stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset .8s cubic-bezier(.2,0,0,1)}

/* Responsive */
@media(max-width:760px){
  .sidebar{width:68px;min-width:68px}
  .sidebar-head{font-size:0;justify-content:center;padding:18px 0}
  .sidebar-head .dot{width:10px;height:10px}
  .nav-item{justify-content:center;padding:12px;border-radius:var(--radius-full);margin:0 4px}
  .nav-item span:not(.ico){display:none}
  .sidebar-foot{display:none}
  .chat-msgs{padding:16px 10px}
  .chat-bar{padding:10px 10px 14px}
  .model-view{padding:14px}
  .mgrid{grid-template-columns:repeat(2,1fr);gap:8px}
  .charts-g{grid-template-columns:1fr;gap:14px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<!-- ====== Sidebar ====== -->
<aside class="sidebar">
  <div class="sidebar-head">
    <span class="dot checking" id="healthDot"></span>
    🧠 AI 预测系统
  </div>
  <nav class="nav-list" id="navList">
    <button class="nav-item active" data-view="chat">
      <span class="ico">💬</span> <span>对话分析</span>
    </button>
    <button class="nav-item" data-view="model">
      <span class="ico">📊</span> <span>模型细节</span>
    </button>
  </nav>
  <div class="sidebar-foot">MBTI RoBERTa v1.0</div>
</aside>

<!-- ====== Main ====== -->
<main class="main">

  <!-- Chat View -->
  <div class="view" id="chatView">
    <div class="chat-msgs" id="chatMsgs">
      <div class="chat-welcome">
        <h1>🧠 MBTI 性格分析</h1>
        <p>输入一段英文文本（日记、社交媒体帖子或自我描述），AI 将分析你的 MBTI 人格类型。</p>
      </div>
    </div>
    <div class="chat-bar">
      <textarea id="inputField" rows="2" maxlength="10000"
        placeholder="I enjoy spending quiet evenings alone..."></textarea>
      <button class="send-btn" id="sendBtn" disabled onclick="submitPredict()">
        <span class="ico-s" style="font-size:20px">↑</span>
        <span class="spinner"></span>
      </button>
    </div>
    <div class="chat-err" id="chatErr"></div>
  </div>

  <!-- Model View -->
  <div class="view hidden model-view" id="modelView">
    <div class="mcard">
      <h3>模型概况</h3>
      <div class="chip-row" id="chipRow"></div>
      <div class="mgrid" id="mGrid"></div>
      <div class="moverall" id="mOverall"></div>
    </div>
    <div class="mcard">
      <h3>评估可视化</h3>
      <div class="tab-bar" id="evalTabs">
        <button class="tab-btn active" data-idx="0">混淆矩阵</button>
        <button class="tab-btn" data-idx="1">ROC 曲线</button>
        <button class="tab-btn" data-idx="2">雷达图</button>
        <button class="tab-btn" data-idx="3">置信度分布</button>
      </div>
      <div class="charts-g" id="chartsG">
        <img class="show full" data-src="confusion_matrices.png" alt="混淆矩阵">
        <img data-src="roc_curves.png" alt="ROC">
        <img data-src="radar.png" alt="雷达图">
        <img class="full" data-src="confidence_dist.png" alt="置信度">
      </div>
    </div>
  </div>

</main>

<script>
// ============================================================
// Helpers
// ============================================================
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

// ============================================================
// View switching
// ============================================================
let currentView = 'chat';
$('#navList').addEventListener('click', e => {
  const btn = e.target.closest('.nav-item');
  if (!btn) return;
  const name = btn.dataset.view;
  if (!name || name === currentView) return;
  // Deactivate all
  $$('.nav-item').forEach(b => b.classList.remove('active'));
  $$('.view').forEach(v => v.classList.add('hidden'));
  // Activate
  btn.classList.add('active');
  if (name === 'chat') $('#chatView').classList.remove('hidden');
  else { $('#modelView').classList.remove('hidden'); loadModelInfo(); }
  currentView = name;
});

// ============================================================
// Health
// ============================================================
async function checkHealth() {
  const dot = $('#healthDot');
  try {
    const r = await fetch('/health');
    if (r.ok) { dot.className = 'dot online'; return; }
  } catch {}
  dot.className = 'dot offline';
}

// ============================================================
// Model Info
// ============================================================
let modelLoaded = false;
async function loadModelInfo() {
  if (modelLoaded) return;
  try {
    const r = await fetch('/api/model');
    if (!r.ok) return;
    const d = await r.json();
    renderModelInfo(d);
    modelLoaded = true;
  } catch {}
}

function renderModelInfo(d) {
  const p = d.params || {}, tc = d.training_config || {};
  const chips = [
    `🧩 ${d.model_name||'roberta-base'}`,`📐 ${p.total_human||'?'} 参数`,
    `📏 Max Length ${d.max_length||256}`,`🔤 Hidden ${d.hidden_size||768}d`,
    `🏊 ${d.pooling||'mean'} pooling`,`⚙️ Batch ${tc.batch_size||'?'}`,
    `📉 LR ${tc.learning_rate!=null?tc.learning_rate.toExponential(1):'?'}`,
    `🔁 ${d.best_epoch||'?'} epochs`,`🖥️ ${d.device||'cpu'}`,
  ];
  $('#chipRow').innerHTML = chips.map(t => `<span class="chip">${t}</span>`).join('');

  const dims = ['EI','SN','TF','JP'];
  const keys = [{k:'accuracy',l:'Acc'},{k:'f1',l:'F1'},{k:'auc',l:'AUC'}];
  const m = d.metrics || {};
  $('#mGrid').innerHTML = dims.map(dim => {
    const dm = m[dim] || {};
    return `<div class="mcard-sm"><div class="lbl">${dim}</div>
      ${keys.map(mk => `<div class="mr"><span class="mk">${mk.l}</span><span class="mv">${dm[mk.k]!=null?(dm[mk.k]*100).toFixed(1)+'%':'-'}</span></div>`).join('')}
    </div>`;
  }).join('');

  const ov = [];
  if (m.exact_match!=null) ov.push({k:'Exact Match',v:(m.exact_match*100).toFixed(1)+'%'});
  if (m.mean_acc!=null) ov.push({k:'Mean Acc',v:(m.mean_acc*100).toFixed(1)+'%'});
  if (m.mean_f1!=null) ov.push({k:'Mean F1',v:(m.mean_f1*100).toFixed(1)+'%'});
  if (m.mean_auc!=null) ov.push({k:'Mean AUC',v:(m.mean_auc*100).toFixed(1)+'%'});
  if (m.macro_mcc!=null) ov.push({k:'Macro MCC',v:m.macro_mcc.toFixed(3)});
  if (m.hamming_loss!=null) ov.push({k:'Hamming Loss',v:(m.hamming_loss*100).toFixed(1)+'%'});
  $('#mOverall').innerHTML = ov.map(o => `<div class="mi"><span class="mk">${o.k}</span><span class="mv">${o.v}</span></div>`).join('');

  // Init chart images
  $$('#chartsG img').forEach((img, i) => {
    img.src = '/static/eval/' + img.dataset.src;
    img.classList.toggle('show', i === 0);
  });
}

// Eval tabs
$('#evalTabs').addEventListener('click', e => {
  const btn = e.target.closest('.tab-btn');
  if (!btn) return;
  const idx = parseInt(btn.dataset.idx);
  $$('#evalTabs .tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  $$('#chartsG img').forEach((img, i) => img.classList.toggle('show', i === idx));
});

// ============================================================
// Chat Predict
// ============================================================
const NAMES = {
  INTJ:['建筑师','Architect'],INTP:['逻辑学家','Logician'],INFJ:['提倡者','Advocate'],INFP:['调停者','Mediator'],
  ENTJ:['指挥官','Commander'],ENTP:['辩论家','Debater'],ENFJ:['主人公','Protagonist'],ENFP:['竞选者','Campaigner'],
  ISTJ:['物流师','Logistician'],ISFJ:['守卫者','Defender'],ISTP:['鉴赏家','Virtuoso'],ISFP:['探险家','Adventurer'],
  ESTJ:['总经理','Executive'],ESFJ:['执政官','Consul'],ESTP:['企业家','Entrepreneur'],ESFP:['表演者','Entertainer'],
};
const DCN = {E:'外向',I:'内向',S:'感觉',N:'直觉',T:'思考',F:'情感',J:'判断',P:'感知'};
const LC = {E:'l-e',I:'l-i',S:'l-s',N:'l-n',T:'l-t',F:'l-f',J:'l-j',P:'l-p'};
const PLS = {EI:['E','I'],SN:['S','N'],TF:['T','F'],JP:['J','P']};
const BC = {EI:'dei',SN:'dsn',TF:'dtf',JP:'djp'};
let loading = false;

const field = $('#inputField');
field.addEventListener('input', () => {
  $('#sendBtn').disabled = !field.value.trim() || loading;
});
field.addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.ctrlKey||e.metaKey)) { e.preventDefault(); submitPredict(); }
});

async function submitPredict() {
  const text = field.value.trim();
  if (!text || loading) return;
  loading = true;
  const btn = $('#sendBtn');
  btn.disabled = true; btn.classList.add('loading'); field.disabled = true;
  $('#chatErr').classList.remove('v');

  addMsg('user', text);

  try {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), 60000);
    const r = await fetch('/api/predict', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({text}), signal:ctrl.signal,
    });
    clearTimeout(t);
    if (!r.ok) { const b = await r.json().catch(()=>({})); throw new Error(b.detail||`服务器错误 (${r.status})`); }
    addAI(await r.json());
    field.value = '';
    scrollChat();
  } catch(e){
    const msg = e.name==='AbortError'?'预测超时（60秒）':e.message.includes('Failed to fetch')?'无法连接服务器':e.message||'预测失败';
    $('#chatErr').textContent = msg; $('#chatErr').classList.add('v');
  } finally {
    loading = false; btn.classList.remove('loading'); btn.disabled = false;
    field.disabled = false; field.focus();
  }
}

function addMsg(role, text) {
  const w = $('#chatMsgs').querySelector('.chat-welcome'); if(w) w.remove();
  const d = document.createElement('div');
  d.className = `msg ${role}`;
  d.innerHTML = `<div class="msg-avatar">${role==='user'?'👤':'🤖'}</div><div class="msg-bubble">${esc(text)}</div>`;
  $('#chatMsgs').appendChild(d);
}

function addAI(d) {
  const w = $('#chatMsgs').querySelector('.chat-welcome'); if(w) w.remove();
  const pred = d.prediction, mbti = pred.mbti_type, probs = pred.probabilities;
  const letters = mbti.split(''), names = NAMES[mbti]||[mbti,mbti];
  const conf = pred.confidence, kw = d.keywords, interp = d.interpretation;
  const dims = ['EI','SN','TF','JP'];

  let h = '<div class="msg ai"><div class="msg-avatar">🤖</div><div class="msg-bubble" style="max-width:100%;flex:1">';
  h += '<div class="type-card-c">';
  h += '<div class="letters">'+letters.map(l=>`<span class="${LC[l]}">${l}</span>`).join('')+'</div>';
  h += `<div class="sub">${letters.map(l=>DCN[l]).join(' · ')}  |  ${names[0]} · ${names[1]}  |  置信度 ${Math.round(conf*100)}%</div>`;
  // SVG gauge
  const circ = 2*Math.PI*24;
  h += `<svg class="gauge-svg" viewBox="0 0 54 54"><circle class="gauge-bg" cx="27" cy="27" r="24"/><circle class="gauge-fg" cx="27" cy="27" r="24" stroke-dasharray="${circ.toFixed(1)}" stroke-dashoffset="${(circ*(1-conf)).toFixed(1)}" transform="rotate(-90 27 27)" stroke="${conf>=.85?'#34a853':conf>=.7?'#fbbc04':'#ffb4ab'}"/></svg>`;
  h += '</div>';

  // Dim bars
  h += '<div class="dim-bars-c">'+dims.map(dim=>{
    const p=probs[dim], isPos=p.positive>=.5;
    const pct=isPos?p.positive:p.negative;
    return `<div class="dbar"><span class="dlbl">${dim}</span>
      <span class="dpole${!isPos?' on':''}">${PLS[dim][1]}</span>
      <div class="track"><div class="fill ${isPos?'fr':'fl'} ${BC[dim]}" style="width:${(pct*100).toFixed(1)}%"></div></div>
      <span class="dpole${isPos?' on':''}">${PLS[dim][0]}</span>
      <span class="dpct">${Math.round(pct*100)}%</span></div>`;
  }).join('')+'</div>';

  // Keywords
  if(kw&&kw.EI){
    const mx=Math.max(...kw.EI.map(k=>Math.abs(k.score)),.0001);
    h += '<div class="kw-box-c">'+kw.EI.slice(0,8).map(k=>{
      const s=k.score,isPos=s>=0;let t=(k.token||'').replace(/^Ġ/,'');
      if(!t||t===' ')return'';return`<span class="kw">${t}<span class="sc ${isPos?'pos':'neg'}">${isPos?'+':''}${s.toFixed(3)}</span></span>`;
    }).filter(Boolean).join('')+'</div>';
  }

  if(interp&&interp.summary) h += `<div class="interp-c">${esc(interp.summary)}</div>`;
  h += '</div></div>';
  $('#chatMsgs').insertAdjacentHTML('beforeend', h);
}

function scrollChat(){const m=$('#chatMsgs');setTimeout(()=>{m.scrollTop=m.scrollHeight},100)}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}

// ============================================================
// Init
// ============================================================
checkHealth();
setInterval(checkHealth, 30000);
</script>
